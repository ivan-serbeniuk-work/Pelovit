; Ліміти завантаження. Образ php:8.3-fpm за замовчуванням дає
; upload_max_filesize=2M і post_max_size=8M, тоді як nginx (і в контейнері,
; і на хості) пропускає 20M — через цю розбіжність велике фото долітало
; побитим і падало з 500, а понад 8M обнуляло весь POST разом із CSRF
; («Page Expired»). Тримаємо одне число по всьому ланцюгу.
upload_max_filesize = 20M
post_max_size = 20M

; GD тримає розпакований PNG у пам'яті: 20-мегабайтне фото на час ресайзу
; важить у рази більше за файл.
memory_limit = 256M
