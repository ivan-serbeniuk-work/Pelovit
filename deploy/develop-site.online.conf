# Готовий site-конфіг для host-nginx (develop-site.online).
# Скопіювати у /etc/nginx/sites-available/develop-site.online, потім nginx -t && reload.
# Канонічний домен — БЕЗ www (щоб фронт і API були в одному origin, без CORS).
# Розподіляє трафік: Laravel (127.0.0.1:8000) для /api /admin та бекенд-статики,
# Nuxt SSR (127.0.0.1:3000) — усе інше.
#
# УВАГА: деплой цей файл НЕ застосовує — на сервері конфіг правиться руками,
# тому вони розходяться. Стан на 08.11.2026 (nginx 1.24.0 на Ubuntu):
#   застосовано — ліміти 60M, location /videos/, уся маршрутизація;
#   НЕ застосовано — блок gzip нижче (у глобальному nginx.conf стоїть лише
#   `gzip on`, без gzip_proxied і gzip_types, тож відповіді з Nuxt їдуть
#   нестисненими). Переносити вибірково й перевіряти `nginx -t`, а не
#   копіювати файл цілком.

# ── HTTPS: головний домен (Nuxt + Laravel) ──
server {
    server_name develop-site.online;

    client_max_body_size 60M;
    client_body_timeout 120s;

    # ── Стиснення: за замовчуванням nginx тисне лише text/html і не чіпає
    #    проксовані відповіді, тому JS/CSS з Nuxt їхали сирими (~210 KB на бандл).
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # text/javascript обов'язковий: саме з таким Content-Type Nuxt віддає
    # бандли, а application/javascript їх не покриває.
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml font/woff2;

    # Спільні proxy-заголовки (наслідуються location без власних)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Laravel: API та адмінка ──
    location /api/        { proxy_pass http://127.0.0.1:8000; }
    location /admin       { proxy_pass http://127.0.0.1:8000; }

    # ── Бекенд-статика: кешуємо у браузері на 30 днів ──
    location /vendor/     { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /storage/    { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /products/   { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /categories/ { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    location /images/     { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }
    # Відео: без буферизації в обидва боки — інакше 50 МБ спершу лягають
    # у тимчасовий файл на диску, а Range-запит (перемотування) не доїжджає
    # до браузера як 206.
    location /videos/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /build/      { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "public, max-age=2592000"; }

    # ── Nuxt SSR: увесь інший трафік (вкл. robots.txt, sitemap.xml) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # http2 on;  # ← вимагає nginx >= 1.25.1, а на сервері 1.24.0: з цим рядком
    #              `nginx -t` падає і reload не проходить. Для 1.24 правильна
    #              форма — `listen 443 ssl http2;` у рядках listen вище.
    #              Розкоментувати після апгрейду nginx.
    ssl_certificate /etc/letsencrypt/live/develop-site.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/develop-site.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTPS www → канонічний домен без www ──
server {
    server_name www.develop-site.online;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/develop-site.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/develop-site.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://develop-site.online$request_uri;
}

# ── HTTP → HTTPS (канонічний, без www) ──
server {
    listen 80;
    listen [::]:80;
    server_name develop-site.online www.develop-site.online;
    return 301 https://develop-site.online$request_uri;
}
